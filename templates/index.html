<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>LangTime — Mit bibliotek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Mit bibliotek</h1>
        {% if texts %}
            <ul class="library">
                {% for t in texts %}
                    <li>
                        <a href="/read/{{ t.id }}">{{ t.title }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Ingen tekster endnu. Importér én med:</p>
            <pre>python import_text.py sti/til/fil.txt "Titel"</pre>
        {% endif %}
    </div>
</body>
</html>
