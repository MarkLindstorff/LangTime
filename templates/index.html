<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>LangTime — Mit bibliotek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{{ 'dark-mode' if theme == 'dark' else '' }}">
    <div class="container">
        <button id="theme-toggle" class="theme-toggle" title="Skift dag/nat">
            <span class="sun">☀️</span><span class="moon">🌙</span>
        </button>
        <h1>Mit bibliotek</h1>

        <!-- Upload-formular -->
        <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Titel (valgfrit)">
            <select name="source_lang" required>
                <option value="" disabled selected>Kilde-sprog…</option>
                {% for code, name in languages.items() %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>
            <input type="file" name="file" accept=".txt" required>
            <button type="submit">Tilføj tekst</button>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
        </form>

        {% if texts %}
            <ul class="library">
                {% for t in texts %}
                    <li>
                        <a href="/read/{{ t.id }}">
                            {{ t.title }}
                            <span class="lang-badge">{{ t.source_lang|upper }}</span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Ingen tekster endnu — prøv formularen ovenfor!</p>
        {% endif %}
    </div>
</body>
</html>
