<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>LangTime — Mit bibliotek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Mit bibliotek</h1>

        <!-- Upload-formular -->
        <form class="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Titel (valgfrit)">
            <input type="file" name="file" accept=".txt" required>
            <button type="submit">Tilføj tekst</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if texts %}
            <ul class="library">
                {% for t in texts %}
                    <li>
                        <a href="/read/{{ t.id }}">{{ t.title }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Ingen tekster endnu — prøv formularen ovenfor!</p>
        {% endif %}
    </div>
</body>
</html>
